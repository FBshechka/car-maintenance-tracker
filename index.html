<body class="bg-slate-900 min-h-screen text-slate-100 flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-slate-800 rounded-3xl p-8 border border-slate-700 shadow-2xl">
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">AutoService Pro</h1>
            <p class="text-slate-400 text-sm">Трекер обслуговування вашого авто</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Назва послуги</label>
                <input id="task" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Наприклад: Заміна мастила">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Пробіг (км)</label>
                <input id="mile" type="number" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Введіть км">
            </div>
            <button id="btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-bold transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                Додати запис
            </button>
        </div>

        <div id="list" class="mt-8 space-y-3">
            <h2 class="text-xs font-bold text-slate-500 uppercase">Останні записи</h2>
            </div>
    </div>

    <script>
        document.getElementById('btn').addEventListener('click', () => {
            const task = document.getElementById('task').value;
            const mile = document.getElementById('mile').value;

            if (!task || !mile) {
                if (window.Sentry) Sentry.captureException(new Error("Порожні поля"));
                return alert("Заповніть всі поля!");
            }

            if (window.posthog) posthog.capture('record_added', { task, mile });

            const list = document.getElementById('list');
            const card = document.createElement('div');
            card.className = "bg-slate-900 border border-slate-700 p-4 rounded-xl flex justify-between items-center animate-in fade-in zoom-in duration-300";
            card.innerHTML = `<div><p class="font-bold text-sm">${task}</p><p class="text-[10px] text-blue-400 font-mono">${mile} KM</p></div><span class="text-[10px] bg-blue-900 text-blue-300 px-2 py-1 rounded-lg font-bold">ОК</span>`;
            list.prepend(card);

            document.getElementById('task').value = '';
            document.getElementById('mile').value = '';
        });
    </script>
</body>
