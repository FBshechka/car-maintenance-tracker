<head>

    <script src="https://js.sentry-cdn.com/0a62e48e45194e0cd135a84cd7161226.min.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-50 p-8">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow">
        <h1 class="text-xl font-bold mb-4">AutoService Pro</h1>
        <input id="task" class="w-full border p-2 mb-2 rounded" placeholder="Завдання">
        <input id="mile" class="w-full border p-2 mb-2 rounded" placeholder="Пробіг">
        <button id="btn" class="w-full bg-blue-600 text-white p-2 rounded">Додати</button>
        <div id="list" class="mt-4"></div>
    </div>

    <script>
        document.getElementById('btn').addEventListener('click', function() {
            const task = document.getElementById('task').value;
            const mile = document.getElementById('mile').value;

            // 1. БЕЗПЕЧНА перевірка помилки (Sentry)
            if (!task || !mile) {
                console.warn("Поля порожні, відправляю в Sentry...");
                if (typeof Sentry !== 'undefined') {
                    Sentry.captureException(new Error("Поля порожні!"));
                } else {
                    console.error("Sentry не завантажився (можливо AdBlock)");
                }
                alert("Заповніть поля!");
                return;
            }

            // 2. БЕЗПЕЧНА відправка в PostHog
            if (typeof posthog !== 'undefined') {
                posthog.capture('record_added', { task: task, mileage: mile });
                console.log("Дані відправлено в PostHog");
            } else {
                console.error("PostHog не завантажився");
            }

            // 3. Відображення на сайті (працює завжди)
            const list = document.getElementById('list');
            list.innerHTML += `<div class="p-2 border-b">${task} (${mile} км)</div>`;
            
            document.getElementById('task').value = '';
            document.getElementById('mile').value = '';
        });
    </script>
</body>
</html>
