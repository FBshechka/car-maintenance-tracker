<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Maintenance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>

    <script src="https://js.sentry-cdn.com/0a62e48e45194e0cd135a84cd7161226.min.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="max-w-md mx-auto py-10 px-4">
        <h1 class="text-3xl font-extrabold text-center mb-8">AutoService Pro</h1>
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 border">
            <input type="text" id="taskInput" placeholder="Заміна мастила" class="w-full p-3 mb-3 border rounded-xl">
            <input type="number" id="mileageInput" placeholder="Пробіг (км)" class="w-full p-3 mb-4 border rounded-xl">
            <button onclick="addRecord()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Додати запис</button>
        </div>
        <div id="recordList" class="space-y-4"></div>
    </div>

    <script>
        function addRecord() {
            // Контекст для Sentry
            Sentry.setUser({ id: "student_user_1", email: "student@university.edu" });

            const task = document.getElementById('taskInput').value;
            const mileage = document.getElementById('mileageInput').value;
            
            // PostHog Event
            posthog.capture('record_added', { task: task, mileage: mileage });

            // Sentry Error Trigger
            if (!task || !mileage) {
                try {
                    throw new Error("Тестова помилка: порожні поля");
                } catch (err) {
                    Sentry.captureException(err);
                    alert("Заповніть поля!");
                    return;
                }
            }

            const list = document.getElementById('recordList');
            list.innerHTML += `<div class="p-4 bg-white rounded-xl border">${task} - ${mileage} км</div>`;
        }
    </script>
</body>
</html>
