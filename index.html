    <script src="https://js.sentry-cdn.com/0a62e48e45194e0cd135a84cd7161226.min.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border">
        <h1 class="text-xl font-bold mb-4">AutoService Pro</h1>
        <input id="task" class="w-full border p-2 mb-2 rounded" placeholder="Завдання">
        <input id="mile" class="w-full border p-2 mb-2 rounded" placeholder="Пробіг">
        <button id="btn" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Додати запис</button>
        <div id="list" class="mt-4"></div>
    </div>

    <script>
        document.getElementById('btn').addEventListener('click', function() {
            const task = document.getElementById('task').value;
            const mile = document.getElementById('mile').value;

            // 1. ПЕРЕВІРКА ПОМИЛКИ (Sentry)
            if (!task || !mile) {
                if (window.Sentry) {
                    Sentry.captureException(new Error("Порожні поля"));
                } else {
                    console.error("Sentry заблоковано!");
                }
                alert("Заповніть поля!");
                return;
            }

            // 2. АНАЛІТИКА (PostHog)
            if (window.posthog) {
                posthog.capture('record_added', { task, mile });
                console.log("PostHog відправив подію");
            } else {
                console.error("PostHog заблоковано!");
            }

            // 3. UI
            document.getElementById('list').innerHTML += `<div class="p-2 border-b">${task}</div>`;
            document.getElementById('task').value = '';
            document.getElementById('mile').value = '';
        });
    </script>
</body>
</html>
